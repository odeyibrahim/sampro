<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - V. Gallery</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-login-body">
    <main class="login-container">
        <div class="logo" aria-hidden="true">V.</div>
        <h1>Admin Access</h1>
        <div id="error" class="error" role="alert" aria-live="assertive"></div>
        <form id="loginForm" novalidate>
            <label for="password" class="visually-hidden">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" autofocus required>
            <button type="submit" id="loginBtn">Login</button>
        </form>
        <div class="footer">
            <a href="/">← Return to Gallery</a>
        </div>
    </main>

    <script src="/js/utils.js"></script>
    <script src="/admin/admin-login.js"></script>
</body>
</html>
