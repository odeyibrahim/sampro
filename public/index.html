<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>V. Gallery · Art + Commerce</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="V. Gallery">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="icons/icon-192.png">
    
    <!-- Critical: intro overlay painted instantly before external CSS arrives -->
    <style>
        .intro-overlay{position:fixed;inset:0;background:#1a1a1a;z-index:9999;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;opacity:1;transition:opacity .6s ease;pointer-events:all}
        .intro-overlay.hidden{opacity:0;pointer-events:none}
        .intro-content{max-width:500px;animation:ciFadeInUp .8s ease}
        @keyframes ciFadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .intro-poem{font-size:clamp(18px,4vh,18px);line-height:1.6;color:#ccc;margin-bottom:16px;white-space:pre-line;font-family:'Copperplate',Georgia,serif}
        .intro-signature{color:#D0A380;font-size:24px;margin-bottom:40px;font-family:'Copperplate',Georgia,serif}
        .enter-gallery{background:none;border:0;color:#ccc;padding:12px 32px;font-size:40px;cursor:pointer;font-family:'Copperplate',Georgia,serif;text-transform:uppercase;letter-spacing:1px;transition:background .3s,color .3s}
        .enter-gallery:hover{background:#000;color:#fff}
        .loading{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10000;display:none;align-items:center;justify-content:center}
        .loading.active{display:flex}
        .spinner{width:24px;height:24px;border:2px solid rgba(255,255,255,.15);border-top-color:#D0A380;border-radius:50%;animation:ciSpin .7s linear infinite}
        @keyframes ciSpin{to{transform:rotate(360deg)}}
    </style>
    <link rel="preload" href="/css/styles.css" as="style">
    <link rel="stylesheet" href="/css/styles.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&family=Roboto+Mono&family=Courier+Prime&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/copperplate" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <!-- App Scripts -->
    <script src="/js/utils.js"></script>
    <script src="/js/app.js" defer></script>
</head>
<body>
    <a href="#mainContent" class="skip-link">Skip to content</a>

    <!-- Offline banner -->
    <div class="offline-banner" id="offlineBanner">You're offline — browsing cached gallery</div>

    <!-- Intro overlay -->
    <div class="intro-overlay" id="introOverlay">
        <div class="intro-content">
            <div class="intro-poem" id="introPoem"></div>
            <div class="intro-signature">V.</div>
            <button class="enter-gallery" id="enterGalleryBtn">Enter Shop</button>
        </div>
    </div>

    <!-- Loading + notifications -->
    <div class="loading" id="loading"><div class="spinner"></div></div>
    <div class="notification" id="notification" role="status" aria-live="polite"></div>

    <!-- Install toast (PWA prompt) -->
    <div class="install-toast" id="installToast" role="dialog" aria-label="Install app">
        <span>Add V. Gallery to your home screen</span>
        <div style="display:flex; gap:6px; flex-shrink:0;">
            <button class="dismiss" id="installDismiss" type="button">Not now</button>
            <button id="installConfirm" type="button">Install</button>
        </div>
    </div>

    <!-- Share overlay (preview screenshot before download) -->
    <div class="share-overlay" id="shareOverlay" role="dialog" aria-modal="true" aria-label="Share preview">
        <div class="share-container">
            <img id="shareImage" class="share-image" alt="Share preview">
            <div class="share-actions">
                <button class="share-btn" id="shareDownloadBtn" type="button">Download</button>
                <button class="share-btn" id="shareCloseBtn" type="button">Close</button>
            </div>
        </div>
    </div>

    <!-- Content wrapper: holds chrome-layer + split-container -->
    <div class="content-wrapper" id="contentWrapper">

        <!-- Chrome layer: logo + grid icon, anchored to content width -->
        <div class="chrome-layer" id="chromeLayer">
            <div class="logo-container" id="siteLogo" role="button" tabindex="0" aria-label="Return to intro">
                <span class="logo-text">V.</span>
            </div>
            <button class="grid-icon-top" id="gridIconTop" type="button" aria-label="Open grid view">☷</button>
        </div>

        <!-- Main split container -->
        <div class="split-container" id="mainContent">
            <!-- Top half: product media -->
            <div class="product-half" id="productHalf">
                <video class="bg-media-layer" id="bgVideoTop" muted loop playsinline></video>
                <img class="bg-media-layer" id="bgImageTop" alt="">

                <div class="frame-container">
                    <div class="product-frame" id="productFrame" role="button" tabindex="0" aria-label="Toggle zoom">
                        <div class="frame-inner">
                            <img class="product-image" id="mainImage" alt="">
                            <video class="product-video" id="mainVideo" playsinline controls></video>
                            <div class="text-content" id="textContent" style="display:none;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom half: product info -->
            <div class="info-half" id="infoHalf">
                <video class="bg-media-layer" id="bgVideoBottom" muted loop playsinline></video>
                <img class="bg-media-layer" id="bgImageBottom" alt="">

                <div class="info-container" id="infoContainer">
                    <div class="description" id="descriptionText">Loading...</div>
                    <div class="title-author">
                        <span id="productTitle">-</span>
                        <span id="productCreator" class="product-creator">V.</span>
                    </div>

                    <div class="action-row" id="priceRow">
                        <button class="currency-selector" id="currencyDisplay" type="button">USD</button>
                        <span class="price-tag" id="priceTag"></span>
                        <span class="original-price" id="originalPrice" style="display:none;"></span>
                        <button class="icon-button" id="cartButton" type="button" aria-label="Buy now">𐚱</button>
                        <button class="icon-button heart" id="heartButton" type="button" aria-label="Save">♡</button>
                        <span class="stock-badge" id="stockBadge"></span>
                    </div>
                </div>
            </div>

            <!-- Bottom nav -->
            <nav class="bottom-nav" aria-label="Gallery navigation">
                <div class="nav-content">
                    <div class="nav-left">
                        <span class="gallery-brand" id="galleryBrand">v.gallery.shop</span>
                    </div>
                    <div class="nav-arrows">
                        <button class="arrow-btn" id="prevBtn" type="button" aria-label="Previous">‹</button>
                        <div class="page-indicator" id="pageIndicator">1/1</div>
                        <button class="arrow-btn" id="nextBtn" type="button" aria-label="Next">›</button>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <!-- Grid overlay (sticky header + eye-toggle) -->
    <div class="grid-overlay" id="gridOverlay" role="dialog" aria-modal="true" aria-label="Grid view">
        <div class="grid-header">
            <div class="grid-filters">
                <button class="filter-btn active" data-filter="all" type="button">All</button>
                <button class="filter-btn" data-filter="original" type="button">Originals</button>
                <button class="filter-btn" data-filter="print" type="button">Prints</button>
                <button class="filter-btn" data-filter="merch" type="button">Products</button>
                <button class="filter-btn" data-filter="saved" type="button">♡ Saved</button>
                <button class="eye-toggle" id="eyeToggle" type="button" title="Toggle details" aria-label="Toggle grid details">👁</button>
            </div>
            <span class="close-grid-btn" data-action="close-grid" role="button" tabindex="0" aria-label="Close grid">←</span>
        </div>
        <div class="grid-container" id="gridContainer"></div>
    </div>

    <!-- Checkout -->
    <div class="checkout-overlay" id="checkoutOverlay" data-action="close-checkout-overlay"></div>
    <div class="checkout-panel" id="checkoutPanel" role="dialog" aria-modal="true" aria-label="Checkout">
        <div class="checkout-header">
            <h2>Checkout</h2>
            <span class="close-checkout" data-action="close-checkout" role="button" tabindex="0" aria-label="Close checkout">←</span>
        </div>

        <div class="checkout-layout">
            <div class="order-summary">
                <h3 style="margin-bottom: 20px; font-size: 14px; font-weight: 400;">Your Order</h3>
                <div id="checkoutProductPreview"></div>

                <div class="quantity-selector">
                    <button class="quantity-btn" data-action="qty-dec" type="button" aria-label="Decrease quantity">−</button>
                    <span id="checkoutQuantity" style="font-size: 16px; min-width: 40px; text-align: center;">1</span>
                    <button class="quantity-btn" data-action="qty-inc" type="button" aria-label="Increase quantity">+</button>
                </div>

                <div style="margin-top: 20px;">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="checkoutSubtotal"></span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span id="checkoutShipping"></span>
                    </div>
                    <div class="summary-row">
                        <span>Tax</span>
                        <span id="checkoutTax"></span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="checkoutTotal"></span>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label for="checkoutCountry">Shipping Country</label>
                    <select id="checkoutCountry">
                        <option value="">Select country</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="checkoutShippingSelect">Shipping Method</label>
                    <select id="checkoutShippingSelect">
                        <option value="standard">Standard</option>
                        <option value="express">Express</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="checkoutDiscountCode">Discount Code</label>
                    <input type="text" id="checkoutDiscountCode" placeholder="Optional">
                </div>
            </div>

            <div class="checkout-form">
                <div class="form-group">
                    <label for="checkoutEmail">Email</label>
                    <input type="email" id="checkoutEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="checkoutName">Full Name</label>
                    <input type="text" id="checkoutName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="checkoutPhone">Phone</label>
                    <input type="tel" id="checkoutPhone" placeholder="+1 555 000 0000">
                </div>
                <div class="form-group">
                    <label for="checkoutAddress">Address</label>
                    <input type="text" id="checkoutAddress" placeholder="Street address">
                </div>

                <div class="payment-method-options" id="paymentMethodOptions">
                    <label class="payment-method-option selected">
                        <input type="radio" name="paymentProvider" value="paystack" checked> Card / Bank via Paystack
                    </label>
                    <label class="payment-method-option">
                        <input type="radio" name="paymentProvider" value="flutterwave"> Card / Bank via Flutterwave
                    </label>
                    <label class="payment-method-option">
                        <input type="radio" name="paymentProvider" value="bank_transfer"> Direct Bank Transfer
                    </label>
                </div>

                <button class="place-order-btn" data-action="place-order" type="button">Place Order</button>

                <div class="bank-details-panel" id="bankDetailsPanel">
                    <h4>Local Bank Account (NGN)</h4>
                    <div class="bank-block" id="bankLocalDetails"></div>
                    <h4>Domiciliary Account (USD)</h4>
                    <div class="bank-block" id="bankDomDetails"></div>
                    <p style="font-size: 11px; margin: 10px 0;">Use reference <strong id="bankRefNumber"></strong>, then send proof below.</p>
                    <button class="whatsapp-proof-btn" id="whatsappProofBtn" type="button">Send Proof via WhatsApp</button>
                </div>

                <div class="checkout-legal">
                    <a href="terms.html">Terms</a>
                    <a href="privacy.html">Privacy</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
