<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · V. Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-dashboard-body">
    <div class="container">
        <header>
            <h1>Admin · V. Gallery</h1>
            <span class="sync-badge" id="syncBadge">Local mode</span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </header>

        <div class="stats" id="stats"></div>

        <div class="section">
            <h2>Recent Orders</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th></tr>
                    </thead>
                    <tbody id="recentOrdersBody"></tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <div class="action-buttons">
                <h2 style="margin:0; flex:1;">Manage Products</h2>
                <button id="addProductBtn">+ Add Product</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Image</th><th>Title</th><th>Type</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="adminProductsBody"></tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <h2>All Orders</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr>
                    </thead>
                    <tbody id="adminOrdersBody"></tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <h2>Store Settings</h2>
            <div style="max-width: 500px;">
                <div class="edit-section">
                    <label class="section-label">Branding</label>
                    <div class="form-group">
                        <label for="storeName">Store Name</label>
                        <input type="text" id="storeName" value="V. Gallery">
                    </div>
                    <div class="form-group">
                        <label>Store Logo</label>
                        <div class="image-upload-area" id="logoUploadArea">Click to upload logo</div>
                        <input type="file" id="logoUpload" accept="image/*" style="display:none;">
                        <img id="logoPreview" class="image-preview">
                    </div>
                </div>

                <div class="edit-section">
                    <label class="section-label">Shipping</label>
                    <div class="row-2">
                        <div class="form-group">
                            <label for="standardShipping">Standard ($)</label>
                            <input type="number" id="standardShipping" value="7" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="expressShipping">Express ($)</label>
                            <input type="number" id="expressShipping" value="15" step="0.01">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="settingWhatsapp">WhatsApp Number</label>
                        <input type="text" id="settingWhatsapp" placeholder="2349012345678">
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="admin-btn" id="saveSettingsBtn" style="flex:1;">Save Settings</button>
                    <button class="admin-btn" id="exportDataBtn" style="flex:1;">Export JSON</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 id="editModalTitle">Add Product</h3>
            <form id="editProductForm">
                <div class="edit-section">
                    <label class="section-label">Basic Info</label>
                    <div class="row-2">
                        <div class="form-group"><label>Title *</label><input type="text" id="editTitle" required></div>
                        <div class="form-group"><label>Author</label><input type="text" id="editAuthor" value="V."></div>
                    </div>
                    <label class="inline-check"><input type="checkbox" id="editShowAuthor" checked> Show author next to title</label>
                    <div class="form-group"><label>Description</label><textarea id="editDescription" rows="4"></textarea></div>
                    <div class="row-3">
                        <div class="form-group"><label>Type</label><select id="editType"><option value="original">Original</option><option value="print">Print</option><option value="merch">Merch</option><option value="craft">Craft</option></select></div>
                        <div class="form-group"><label>Orientation</label><select id="editOrientation"><option value="square">Square</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div>
                        <div class="form-group"><label>Stock</label><input type="number" id="editStock" min="0" value="1"></div>
                    </div>
                    <div class="form-group"><label>Price (USD)</label><input type="number" id="editPrice" step="0.01"></div>
                </div>

                <div class="edit-section">
                    <label class="section-label">Media</label>
                    <div class="form-group"><label>Image/Video URL</label><input type="text" id="editImageUrl" placeholder="https://..."></div>
                    <div class="file-upload-section visible">
                        <label>Or Upload from Device</label>
                        <div class="image-upload-area" id="deviceUploadArea">Click to upload from device</div>
                        <input type="file" id="deviceFileUpload" accept="image/*,video/*" style="display:none;">
                        <img id="previewMain" class="image-preview">
                    </div>
                </div>

                <div class="edit-section">
                    <label class="section-label">Frame</label>
                    <div class="row-2">
                        <div class="form-group"><label>Border Width (px)</label><input type="number" min="0" max="20" id="editBorderWidth" value="0"></div>
                        <div class="form-group"><label>Border Color</label><input type="color" id="editBorderColor" value="#000000"></div>
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="submit" class="admin-btn confirm-pay" style="flex:2;">Save Product</button>
                    <button type="button" class="admin-btn" id="cancelEditBtn" style="flex:1;">Cancel</button>
                    <button type="button" class="admin-btn" id="deleteProductBtn" style="flex:1; display:none;">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/admin/admin-app.js"></script>
</body>
</html>
