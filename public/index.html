<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login · V. Gallery</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
        .subtitle { font-size: 12px; color: #888; margin-bottom: 30px; }
        .error {
            display: none;
            background: #fef2f2;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label {
            display: block; font-size: 11px; color: #888;
            text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px;
        }
        .form-group input {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 14px; font-family: 'Inter', sans-serif;
            outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #000; }
        .login-btn {
            width: 100%; padding: 12px; background: #000; color: #fff;
            border: none; border-radius: 6px; font-size: 13px;
            font-family: 'Inter', sans-serif; font-weight: 500;
            cursor: pointer; transition: opacity 0.2s; margin-top: 8px;
        }
        .login-btn:hover { opacity: 0.9; }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .back-link { display: inline-block; margin-top: 20px; font-size: 11px; color: #888; text-decoration: none; }
        .back-link:hover { color: #000; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>V. Gallery</h1>
        <p class="subtitle">Admin access</p>
        <div class="error" id="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter admin password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Login</button>
        </form>
        <a class="back-link" href="/">Back to store</a>
    </div>
    <script src="admin-login.js"></script>
</body>
</html>
